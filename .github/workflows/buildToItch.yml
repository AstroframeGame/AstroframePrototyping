name: Deploy to Itch.io

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Godot Export
        id: export
        uses: firebelley/godot-export@v7.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot/releases/download/4.5-stable/Godot_v4.5-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot/releases/download/4.5-stable/Godot_v4.5-stable_export_templates.tpz
          relative_project_path: ./
          archive_output: true
          cache: true
        env:
          GITHUB_TOKEN: ${{ secrets.GH_API_KEY }}
          
      - name: Publish to Itch
        uses: Ayowel/butler-to-itch@v1.3.0
        with:
          butler_key: ${{ secrets.BUTLER_API_KEY }}
          itch_user: sentientdragon5gamedev
          itch_game: astroframeprototype
          version: "${{ github.ref_name }}"
          files: "${{ steps.export.outputs.archive_directory }}/astroframe-web.zip"
